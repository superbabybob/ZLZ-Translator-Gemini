# ============================================================
#  ZLZ-Translator Configuration File
#  (Restart application or click "Reload Settings" after edits)
# ============================================================

[general]
# Default translation tone for Thai -> English: formal | friendly | brief
default_tone = "friendly"

# Translation providers: gemini (Google Gemini API with free tier quota)
provider_order = ["gemini"]

# Maximum request timeout per translation (seconds)
timeout_seconds = 60

# Automatically translate English back to Thai to verify meaning (disabled by default to save quota)
auto_back_translate = false

# Use compact summarized glossary for all translations to save tokens (local model always uses compact glossary)
compact_glossary = false

[modes]
# Active model per mode (Priority #1: gemini-3.5-flash-lite with 500 requests/day quota)
read    = "gemini-3.5-flash-lite"   # English -> Thai
reply   = "gemini-3.5-flash-lite"   # Thai -> English
explain = "gemini-3.5-flash-lite"   # Explain customer intent
polish  = "gemini-3.5-flash-lite"   # Refine user-written English

# ------------------------------------------------------------
[providers.gemini]
# Set your API key in .env as GEMINI_API_KEY
# Get your free key at: https://aistudio.google.com/apikey
model = "gemini-3.5-flash-lite"

# Automatic model fallback chain on quota exhaustion (HTTP 429), high demand (HTTP 503), or timeout:
# If primary model is unavailable, these fallback models will be attempted in order:
fallback_models = [
    "gemini-3.1-flash-lite",  # Priority #2: 15 RPM / 500 requests per day (High quota)
    "gemini-3.8-flash",       # Priority #3: 5 RPM / 20 requests per day (Latest Flash)
    "gemini-3.7-flash",       # Priority #4: 5 RPM / 20 requests per day
    "gemini-3.6-flash",       # Priority #5: 5 RPM / 20 requests per day
    "gemini-3.5-flash",       # Priority #6: 5 RPM / 20 requests per day
    "gemini-3-flash",         # Priority #7: 5 RPM / 20 requests per day
    "gemini-2.5-flash-lite",  # Priority #8: 10 RPM / 20 requests per day
    "gemini-2.5-flash"        # Priority #9: 5 RPM / 20 requests per day
]


# Cooldown duration (in seconds) to pause a rate-limited model before retrying
cooldown_seconds = 60

# ------------------------------------------------------------
[providers.ollama]
# URL of your local Ollama instance (default: http://localhost:11434)
# Optional: Used when switching provider to local models in System Tray / Settings
url = "http://localhost:11434"

# Primary local model to use for translation (e.g. qwen2.5:7b, llama3.2, mistral)
model = "qwen2.5:7b"

# Priority list of fallback local models if primary model is unavailable or fails:
fallback_models = []

# Timeout for local model generation in seconds (local models may take longer on CPU/GPU)
timeout_seconds = 120

# Temperature for generation (0.1 - 0.5 recommended for translation consistency)
temperature = 0.3


# ------------------------------------------------------------
[hotkeys]
# F-keys work regardless of keyboard language (TH/EN) and won't conflict with Discord
read    = "f8"           # Highlight English -> Thai popup
reply   = "f9"           # Type Thai in input box -> Replace with English (without sending)
explain = "shift+f8"     # Highlight text -> Explain customer intent
polish  = "shift+f9"     # Type English in input box -> Proofread and polish naturally

# Restrict hotkeys to specific active window titles (empty = active in all applications)
# Example: ["Discord"] prevents hotkey conflicts in other apps
only_in_apps = []

[discord]
# Automatically start Discord app bot alongside Hotkey app (requires DISCORD_TOKEN in .env)
# Can be toggled anytime from the system tray menu
autostart = false

[ui]
# Font size for popup windows
font_size = 11
# Auto-close popup after seconds (0 = keep open until dismissed)
auto_close_seconds = 0
